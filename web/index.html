<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- 防止瀏覽器長期快取舊版入口頁 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KLF-棕化">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=1.3.0">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1.3.0">

  <title>KLF-棕化</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // ============================================================
    // KLF-棕化 Web App 自動更新
    //
    // 每次開啟主畫面 App：
    // 1. 主動檢查 Service Worker 新版本
    // 2. 發現新版時要求新版立即接管
    // 3. 新版接管後自動重新載入
    //
    // 使用者不需要重新建立主畫面捷徑。
    // ============================================================

    if ('serviceWorker' in navigator) {
      let reloadingForUpdate = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadingForUpdate) {
          return;
        }

        reloadingForUpdate = true;
        window.location.reload();
      });

      async function checkForAppUpdate() {
        try {
          const registrations =
              await navigator.serviceWorker.getRegistrations();

          for (const registration of registrations) {
            try {
              await registration.update();

              // 如果新版 Service Worker 已經等待接管，
              // 要求它立即啟用。
              if (registration.waiting) {
                registration.waiting.postMessage({
                  type: 'SKIP_WAITING'
                });
              }
            } catch (_) {
              // 更新檢查失敗時不影響正常開啟 App。
            }
          }
        } catch (_) {
          // 沒有 Service Worker 或檢查失敗時照常啟動。
        }
      }

      // App 第一次開啟
      window.addEventListener('load', () => {
        checkForAppUpdate();
      });

      // 從背景回到前景時再次檢查
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkForAppUpdate();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
